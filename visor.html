<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Libro Interactivo</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      width: 100%; height: 100%;
      overflow: hidden;
      background: #111;
    }

    /* ── Libro ocupa toda la pantalla ─────────── */
    #libroWrap {
      position: fixed;
      inset: 0;
      background: #f5f0e8;
      overflow: hidden;
      perspective: 1800px;
    }

    /* Lomo central */
    #libroWrap::after {
      content: "";
      position: absolute;
      top: 0; left: 50%;
      width: 8px; height: 100%;
      background: linear-gradient(to right,
        rgba(0,0,0,0.28) 0%,
        rgba(0,0,0,0.06) 60%,
        transparent 100%);
      transform: translateX(-100%);
      z-index: 5;
      pointer-events: none;
    }

    /* ── Páginas ─────────────────────────────── */
    .pagina {
      position: absolute;
      top: 0;
      width: 50%; height: 100%;
      background: #f5f0e8;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .pagina canvas {
      max-width: 100%;
      max-height: 100%;
      display: block;
    }

    #izquierda {
      left: 0; z-index: 1;
      border-right: 2px solid rgba(0,0,0,0.1);
    }
    #derecha { left: 50%; z-index: 1; }

    /* ── Hoja que gira ───────────────────────── */
    #hoja {
      position: absolute;
      top: 0; left: 50%;
      width: 50%; height: 100%;
      z-index: 10;
      transform-style: preserve-3d;
      display: none;
    }

    .cara {
      position: absolute;
      top: 0; left: 0;
      width: 100%; height: 100%;
      background: #f5f0e8;
      overflow: hidden;
      backface-visibility: hidden;
      -webkit-backface-visibility: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .cara canvas {
      max-width: 100%;
      max-height: 100%;
      display: block;
    }

    #frente { transform: rotateY(0deg);   z-index: 2; }
    #atras  { transform: rotateY(180deg); z-index: 1; }

    /* ── Animaciones ─────────────────────────── */
    .girar {
      display: block !important;
      transform-origin: left center;
      animation: pasarPagina 1.0s ease-in-out forwards;
      filter: drop-shadow(-6px 0 10px rgba(0,0,0,0.3));
    }

    @keyframes pasarPagina {
      0%   { transform: rotateY(0deg);    }
      25%  { transform: rotateY(-45deg);  }
      50%  { transform: rotateY(-100deg); }
      75%  { transform: rotateY(-150deg); }
      100% { transform: rotateY(-180deg); }
    }

    .girarAnterior {
      display: block !important;
      left: 0 !important;
      transform-origin: right center;
      animation: regresarPagina 1.0s ease-in-out forwards;
      filter: drop-shadow(6px 0 10px rgba(0,0,0,0.3));
    }

    @keyframes regresarPagina {
      0%   { transform: rotateY(0deg);   }
      25%  { transform: rotateY(45deg);  }
      50%  { transform: rotateY(100deg); }
      75%  { transform: rotateY(150deg); }
      100% { transform: rotateY(180deg); }
    }

    /* ── Spinner ─────────────────────────────── */
    #cargando {
      position: absolute;
      inset: 0;
      background: rgba(17,17,17,0.88);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 30;
      gap: 14px;
      color: white;
      font-family: Arial, sans-serif;
      font-size: 16px;
    }

    .spinner {
      width: 44px; height: 44px;
      border: 4px solid rgba(255,255,255,0.15);
      border-top-color: #7c3aed;
      border-radius: 50%;
      animation: spin 0.75s linear infinite;
    }

    @keyframes spin { to { transform: rotate(360deg); } }
    #cargando.oculto { display: none; }

    /* ── Barra de controles flotante ─────────── */
    .barra {
      position: fixed;
      bottom: 0; left: 0; right: 0;
      z-index: 20;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 16px;
      padding: 10px 20px;
      background: rgba(0,0,0,0.55);
      backdrop-filter: blur(8px);
      font-family: Arial, sans-serif;
    }

    /* La barra se oculta y solo aparece al pasar el mouse abajo */
    .barra {
      opacity: 0;
      transform: translateY(100%);
      transition: opacity 0.25s, transform 0.25s;
    }
    body:hover .barra,
    .barra:hover {
      opacity: 1;
      transform: translateY(0);
    }

    button.ctrl {
      padding: 9px 26px;
      font-size: 15px;
      font-weight: 700;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      background: #7c3aed;
      color: white;
      transition: background 0.18s, transform 0.12s;
    }
    button.ctrl:hover:not(:disabled) { background: #6d28d9; transform: scale(1.05); }
    button.ctrl:disabled { opacity: 0.35; cursor: not-allowed; transform: none; }

    #numero {
      color: rgba(255,255,255,0.8);
      font-size: 14px;
      font-family: Arial, sans-serif;
      min-width: 180px;
      text-align: center;
    }

    /* ── Botón cerrar (esquina superior izquierda) ── */
    #btnCerrar {
      position: fixed;
      top: 12px; left: 12px;
      z-index: 25;
      width: 36px; height: 36px;
      border-radius: 50%;
      border: none;
      background: rgba(0,0,0,0.45);
      color: white;
      font-size: 18px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      opacity: 0;
      transition: opacity 0.25s, background 0.18s;
      backdrop-filter: blur(6px);
    }
    body:hover #btnCerrar { opacity: 1; }
    #btnCerrar:hover { background: rgba(0,0,0,0.7); }

    /* ── Zoom flotante (esquina superior derecha) ── */
    .zoom-float {
      position: fixed;
      top: 12px; right: 12px;
      z-index: 25;
      display: flex;
      align-items: center;
      gap: 6px;
      background: rgba(0,0,0,0.45);
      backdrop-filter: blur(6px);
      border-radius: 8px;
      padding: 5px 10px;
      font-family: Arial, sans-serif;
      opacity: 0;
      transition: opacity 0.25s;
    }
    body:hover .zoom-float { opacity: 1; }

    .btn-zoom {
      width: 28px; height: 28px;
      border-radius: 6px;
      border: none;
      background: #7c3aed;
      color: white;
      font-size: 17px;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background 0.15s;
    }
    .btn-zoom:hover { background: #6d28d9; }

    #zoomValor {
      color: white;
      font-size: 13px;
      font-weight: 700;
      min-width: 38px;
      text-align: center;
    }
  </style>
</head>
<body>

  <!-- Botón cerrar -->
  <button id="btnCerrar" onclick="window.history.back()" title="Volver">&#x2715;</button>

  <!-- Zoom flotante -->
  <div class="zoom-float">
    <button class="btn-zoom" onclick="cambiarZoom(-1)">−</button>
    <span id="zoomValor">300%</span>
    <button class="btn-zoom" onclick="cambiarZoom(+1)">+</button>
  </div>

  <!-- Libro (pantalla completa) -->
  <div id="libroWrap">
    <div id="cargando">
      <div class="spinner"></div>
      <span id="msgCargando">Cargando libro...</span>
    </div>

    <div class="pagina" id="izquierda"><canvas id="canvasIzq"></canvas></div>
    <div class="pagina" id="derecha"  ><canvas id="canvasDer"></canvas></div>

    <div id="hoja">
      <div class="cara" id="frente"><canvas id="canvasFrente"></canvas></div>
      <div class="cara" id="atras" ><canvas id="canvasAtras" ></canvas></div>
    </div>
  </div>

  <!-- Barra inferior flotante -->
  <div class="barra">
    <button class="ctrl" id="btnAnterior" onclick="anterior()">⬅ Anterior</button>
    <span id="numero">Cargando...</span>
    <button class="ctrl" id="btnSiguiente" onclick="siguiente()">Siguiente ➡</button>
  </div>

  <script type="module">
    import * as pdfjsLib from "./backend/uploads/pdfs/build/pdf.mjs";
    pdfjsLib.GlobalWorkerOptions.workerSrc = "./backend/uploads/pdfs/build/pdf.worker.mjs";

    const params      = new URLSearchParams(window.location.search);
    const rutaPDF     = params.get("pdf");
    const nombreParam = params.get("titulo");

    const numero      = document.getElementById("numero");
    const btnAnterior = document.getElementById("btnAnterior");
    const btnSig      = document.getElementById("btnSiguiente");
    const cargando    = document.getElementById("cargando");
    const msgCarg     = document.getElementById("msgCargando");
    const zoomValorEl = document.getElementById("zoomValor");
    const libroWrap   = document.getElementById("libroWrap");

    const canvasIzq    = document.getElementById("canvasIzq");
    const canvasDer    = document.getElementById("canvasDer");
    const canvasFrente = document.getElementById("canvasFrente");
    const canvasAtras  = document.getElementById("canvasAtras");
    const hoja         = document.getElementById("hoja");

    // Título de la pestaña
    if (nombreParam) document.title = decodeURIComponent(nombreParam);

    let pdf          = null;
    let paginaActual = 1;
    let animando     = false;

    // Escalas disponibles
    const ESCALAS = [1.0, 1.5, 2.0, 2.5, 3.0, 3.5, 4.0];
    let idxZoom   = 4; // 3.0 por defecto

    function escalaActual() { return ESCALAS[idxZoom]; }

    window.cambiarZoom = async function(delta) {
      const nuevo = Math.max(0, Math.min(ESCALAS.length - 1, idxZoom + delta));
      if (nuevo === idxZoom) return;
      idxZoom = nuevo;
      zoomValorEl.textContent = Math.round(escalaActual() * 100) + "%";
      if (pdf) {
        msgCarg.textContent = "Aplicando zoom...";
        cargando.classList.remove("oculto");
        await renderPar();
        cargando.classList.add("oculto");
      }
    };

    async function renderPagina(n, canvas) {
      const ctx = canvas.getContext("2d");
      if (!pdf || n < 1 || n > pdf.numPages) {
        canvas.width = 10; canvas.height = 10;
        ctx.fillStyle = "#f5f0e8";
        ctx.fillRect(0, 0, 10, 10);
        return;
      }
      const page     = await pdf.getPage(n);
      const dpr      = window.devicePixelRatio || 1;
      const viewport = page.getViewport({ scale: escalaActual() * dpr });
      canvas.width  = viewport.width;
      canvas.height = viewport.height;
      canvas.style.width  = (viewport.width  / dpr) + "px";
      canvas.style.height = (viewport.height / dpr) + "px";
      await page.render({ canvasContext: ctx, viewport }).promise;
    }

    async function renderPar() {
      await Promise.all([
        renderPagina(paginaActual,     canvasIzq),
        renderPagina(paginaActual + 1, canvasDer)
      ]);
      actualizarNumero();
    }

    function actualizarNumero() {
      if (!pdf) return;
      const final = Math.min(paginaActual + 1, pdf.numPages);
      numero.textContent =
        "Páginas " + paginaActual + " – " + final + " de " + pdf.numPages;
      btnAnterior.disabled = paginaActual <= 1;
      btnSig.disabled      = paginaActual + 2 > pdf.numPages;
    }

    window.siguiente = async function () {
      if (!pdf || animando || paginaActual + 2 > pdf.numPages) return;
      animando = true;
      btnAnterior.disabled = btnSig.disabled = true;

      await Promise.all([
        renderPagina(paginaActual + 1, canvasFrente),
        renderPagina(paginaActual + 2, canvasAtras),
        renderPagina(paginaActual + 3, canvasDer)
      ]);

      hoja.classList.remove("girar", "girarAnterior");
      hoja.style.display = "block";
      hoja.style.left    = "50%";
      void hoja.offsetWidth;
      hoja.classList.add("girar");

      setTimeout(async () => {
        paginaActual += 2;
        hoja.classList.remove("girar");
        hoja.style.display = "none";
        await renderPar();
        animando = false;
      }, 1000);
    };

    window.anterior = async function () {
      if (!pdf || animando || paginaActual <= 1) return;
      animando = true;
      btnAnterior.disabled = btnSig.disabled = true;

      await Promise.all([
        renderPagina(paginaActual,     canvasFrente),
        renderPagina(paginaActual - 2, canvasIzq),
        renderPagina(paginaActual - 1, canvasAtras)
      ]);

      hoja.classList.remove("girar", "girarAnterior");
      hoja.style.display = "block";
      hoja.style.left    = "0";
      void hoja.offsetWidth;
      hoja.classList.add("girarAnterior");

      setTimeout(async () => {
        paginaActual -= 2;
        hoja.classList.remove("girarAnterior");
        hoja.style.display = "none";
        hoja.style.left    = "50%";
        await renderPar();
        animando = false;
      }, 1000);
    };

    document.addEventListener("keydown", e => {
      if (e.key === "ArrowRight" || e.key === "PageDown") { e.preventDefault(); siguiente(); }
      if (e.key === "ArrowLeft"  || e.key === "PageUp")   { e.preventDefault(); anterior();  }
      if (e.key === "+" || e.key === "=") { e.preventDefault(); cambiarZoom(+1); }
      if (e.key === "-" || e.key === "_") { e.preventDefault(); cambiarZoom(-1); }
    });

    if (!rutaPDF) {
      cargando.classList.add("oculto");
      numero.textContent = "No se indicó ningún PDF.";
    } else {
      pdfjsLib.getDocument({ url: rutaPDF }).promise
        .then(async doc => {
          pdf = doc;
          await renderPar();
          cargando.classList.add("oculto");
        })
        .catch(err => {
          console.error(err);
          cargando.classList.add("oculto");
          numero.textContent = "Error al cargar el PDF.";
        });
    }
  </script>
</body>
</html>
